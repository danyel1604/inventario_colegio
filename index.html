<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Colegio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        h1 { color: #333; text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; background-color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0056b3; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .stock-bajo { color: red; font-weight: bold; }
        .btn-accion { background-color: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold;}
        .btn-accion:hover { background-color: #218838; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 15% auto; padding: 20px; border-radius: 8px; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .form-grupo { margin-bottom: 15px; }
        .form-grupo label { display: block; margin-bottom: 5px; font-weight: bold;}
        .form-grupo input, .form-grupo select { width: 90%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-guardar { background-color: #0056b3; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px;}
    </style>
</head>
<body>

    <h1>Gestión de Inventario - Colegio</h1>

<!-- Nuevo Buscador EPE 2 -->
    <div style="text-align: center; margin-bottom: 20px;">
        <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="🔍 Buscar por código o nombre del artículo..." style="width: 50%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px;">
    </div>
    <table id="tabla-articulos">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre del Artículo</th>
                <th>Categoría</th>
                <th>Stock Actual</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
        </tbody>
    </table>

    <div id="modal-movimiento" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2>Registrar Movimiento</h2>
            <h3 id="nombre-articulo-modal" style="color: #0056b3; margin-top: 0;"></h3>
            
            <div class="form-grupo">
                <label>Tipo de Movimiento:</label>
                <select id="tipo-movimiento">
                    <option value="ENTRADA">Ingreso de material (+)</option>
                    <option value="SALIDA">Entrega/Retiro (-)</option>
                </select>
            </div>
            <div class="form-grupo">
                <label>Cantidad:</label>
                <input type="number" id="cantidad-movimiento" min="1" value="1">
            </div>
            <div class="form-grupo">
                <label>Responsable:</label>
                <input type="text" id="responsable-movimiento" placeholder="Ej: Profesor Juan">
            </div>
            
            <button class="btn-guardar" onclick="prepararEnvio()">Guardar Movimiento</button>
        </div>
    </div>

    <script>
        const urlAPI = 'http://127.0.0.1:8000/api/articulos/';
        const urlMovimientos = 'http://127.0.0.1:8000/api/movimientos/';
        let articuloSeleccionadoId = null;

        function cargarInventario() {
            fetch(urlAPI)
                .then(respuesta => respuesta.json())
                .then(datos => {
                    const cuerpoTabla = document.getElementById('cuerpo-tabla');
                    cuerpoTabla.innerHTML = ''; 
                    datos.forEach(articulo => {
                        const fila = document.createElement('tr');
                        const claseStock = articulo.stock_actual < 5 ? 'stock-bajo' : '';
                        fila.innerHTML = `
                            <td>${articulo.codigo_interno}</td>
                            <td>${articulo.nombre}</td>
                            <td>${articulo.categoria}</td>
                            <td class="${claseStock}">${articulo.stock_actual}</td>
                            <td>
                                <button class="btn-accion" onclick="abrirModal(${articulo.id}, '${articulo.nombre}')">Mover Stock</button>
                            </td>
                        `;
                        cuerpoTabla.appendChild(fila);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function abrirModal(id, nombre) {
            articuloSeleccionadoId = id;
            document.getElementById('nombre-articulo-modal').innerText = nombre;
            document.getElementById('modal-movimiento').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('modal-movimiento').style.display = 'none';
            document.getElementById('cantidad-movimiento').value = '1';
            document.getElementById('responsable-movimiento').value = '';
        }

        function prepararEnvio() {
            const tipo = document.getElementById('tipo-movimiento').value;
            const cantidad = document.getElementById('cantidad-movimiento').value;
            const responsable = document.getElementById('responsable-movimiento').value;

            if (!responsable) {
                alert("Por favor, ingresa el nombre del responsable.");
                return;
            }

            const datosParaEnviar = {
                articulo_id: articuloSeleccionadoId,
                tipo: tipo,
                cantidad: cantidad,
                responsable: responsable
            };

            fetch(urlMovimientos, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosParaEnviar)
            })
            .then(respuesta => respuesta.json())
            .then(resultado => {
                if (resultado.error) {
                    alert("⚠️ ALERTA: " + resultado.error);
                } else {
                    alert("✅ " + resultado.mensaje);
                    cerrarModal();
                    cargarInventario(); 
                }
            })
            .catch(error => console.error('Error:', error));
        }

        cargarInventario();
// NUEVA FUNCIÓN EPE 2: Buscador en tiempo real
        function filtrarTabla() {
            const input = document.getElementById("buscador");
            const filtro = input.value.toUpperCase();
            const tabla = document.getElementById("cuerpo-tabla");
            const filas = tabla.getElementsByTagName("tr");

            for (let i = 0; i < filas.length; i++) {
                const columnaCodigo = filas[i].getElementsByTagName("td")[0];
                const columnaNombre = filas[i].getElementsByTagName("td")[1];
                
                if (columnaCodigo || columnaNombre) {
                    const textoCodigo = columnaCodigo.textContent || columnaCodigo.innerText;
                    const textoNombre = columnaNombre.textContent || columnaNombre.innerText;
                    
                    if (textoCodigo.toUpperCase().indexOf(filtro) > -1 || textoNombre.toUpperCase().indexOf(filtro) > -1) {
                        filas[i].style.display = "";
                    } else {
                        filas[i].style.display = "none";
                    }
                }
            }
        }

    </script>
</body>
</html>
